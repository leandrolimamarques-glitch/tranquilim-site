# Tranquilim no Fly.io. Região gru (São Paulo), junto do banco (Neon, sa-east-1).
# Segredos (não ficam aqui): DATABASE_URL e LLM_API_KEY, postos pelo GitHub Actions.
app = "tranquilim"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  # Leitura da carteira de vacinação. Só a chave é segredo.
  LLM_MODEL = "claude-opus-5-5"
  LLM_EFFORT = "high"
  # Assistente das famílias: modelo barato, preso ao conteúdo do app (server/pergunta.ts).
  LLM_MODELO_ASSISTENTE = "claude-haiku-5-5"
  # E-mails (confirmação e senha nova). A chave RESEND_API_KEY vai como segredo.
  EMAIL_REMETENTE = "Tranquilim <nao-responda@tranquilim.com.br>"
  URL_BASE = "https://app.tranquilim.com.br"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "15s"
    interval = "30s"
    method = "GET"
    path = "/api/saude"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
